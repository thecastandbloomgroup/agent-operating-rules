# Five stages, in this order: review, build, test, docs, package. review runs
# format, then lint. Each job calls the task of its stage (Taskfile.yml), so a
# job runs the same step that a person runs with task <name>. task ci runs the
# five tasks in this order on a machine. The push mirror of GitLab, not a job,
# copies main to GitHub (docs/how-to/set-up-the-github-mirror.md).
# The evaluate stage comes last. It runs only on main, when a person starts it
# or a schedule runs it (docs/how-to/run-an-evaluation.md).
# docs/reference/tasks-and-ci.md describes each job.
stages: [review, build, test, docs, package, evaluate, report]

# uv in GitLab CI, as in https://docs.astral.sh/uv/guides/integration/gitlab/.
# The build folder is a separate mount, so uv copies files instead of linking.
variables:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

# A new commit on a branch cancels the jobs of its older pipeline, so they
# use no more minutes.
workflow:
  auto_cancel:
    on_new_commit: interruptible

# A job gets no cache unless it names one. A job with dependencies: [] gets
# no artifacts of an earlier job. So each job downloads only what its task uses.
default:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-alpine
  interruptible: true
  before_script: &install-task
    # Task 3.53.1 for the architecture of the runner. The checksum stops any
    # other file.
    - apk add --no-cache curl
    - |
      case "$(uname -m)" in
        x86_64) arch=amd64; sum=a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7 ;;
        aarch64) arch=arm64; sum=e3ad19101493a0112e1f22ae8ccc54bf03e533b1076a0ca1e6c782a09ad2e588 ;;
      esac
      curl -fsSL -o /tmp/task.tar.gz "https://github.com/go-task/task/releases/download/v3.53.1/task_linux_$arch.tar.gz"
      echo "$sum  /tmp/task.tar.gz" | sha256sum -c -
      tar -xzf /tmp/task.tar.gz -C /usr/local/bin task

# Only review runs the tools of uv, so only it gets its cache.
.uv-cache:
  cache:
    - key:
        files: [Taskfile.yml]
      paths: [$UV_CACHE_DIR]
  # Keep only the files in the cache that uv cannot build again fast.
  after_script:
    - uv cache prune --ci

review:
  stage: review
  extends: .uv-cache
  script:
    - task review

# .task/ holds the checksum of build, so the package job skips build.
build:
  stage: build
  script:
    - task build
  artifacts:
    paths: [.build/, .task/]
    expire_in: 1 week

test:
  stage: test
  dependencies: []
  script:
    - task test

docs:
  stage: docs
  dependencies: []
  script:
    - task docs

# Only the artifacts of build: the files of the release and their checksum.
package:
  stage: package
  dependencies: [build]
  script:
    - task package
  artifacts:
    paths: ['dist/*.zip']
    expire_in: 1 month

# The evaluation calls the Perplexity Agent API, which costs money, so it runs
# on main only: when a person starts one job of the matrix, or when a pipeline
# schedule runs. The Doppler service token is a protected, masked variable, so
# no other branch gets it. The token reads one Doppler config, and doppler run
# puts only PERPLEXITY_TOKEN in the environment of the task. The config holds
# other secrets, and --only-secrets keeps them out of the job.
# docs/how-to/set-up-doppler-for-evaluation.md gives the setup.
#
# Each job of the matrix runs one provider at the same time as the others, and
# writes .eval/pipeline-ID/results/PROVIDER.jsonl. The job evaluate:report
# merges the JSONL files of the pipeline into the final view of the run.
evaluate:
  stage: evaluate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - PROVIDER: [anthropic, openai, google, moonshot, zai, xai]
  # A cancelled run loses the calls it paid for, so a new commit does not cancel it.
  interruptible: false
  timeout: 2h
  dependencies: []
  variables:
    SAMPLES: "3"
    PROMPTS: ""
    ALL_PAIRS: "false"
  before_script:
    - *install-task
    # The Doppler CLI from its signed Alpine repository. The checksum of the
    # signing key, taken on 2026-10-26, stops any other key.
    - curl -fsSL --retry 3 -o /etc/apk/keys/cli@doppler-8004D9FF50437357.rsa.pub https://packages.doppler.com/public/cli/rsa.8004D9FF50437357.key
    - echo "911d73fc4e2dee93f9a6309cad9ffec272db997c6e8b5b4ef360328eb8ecd574  /etc/apk/keys/cli@doppler-8004D9FF50437357.rsa.pub" | sha256sum -c -
    - echo https://packages.doppler.com/public/cli/alpine/any-version/main >> /etc/apk/repositories
    - apk add --no-cache doppler
  script:
    - doppler run --only-secrets PERPLEXITY_TOKEN -- task eval:provider PROVIDER="$PROVIDER" RUN="pipeline-$CI_PIPELINE_ID" SAMPLES="$SAMPLES" PROMPTS="$PROMPTS" ALL_PAIRS="$ALL_PAIRS"
  artifacts:
    when: always
    paths: [.eval/]
    expire_in: 3 months

# The final view of the evaluation: scores.csv, calls.csv, human-test.csv and
# summary.md, from the JSONL of each evaluate job of this pipeline that ran. A
# schedule runs it after the evaluate stage. On a manual run, start it when
# the provider jobs end, and again after each provider job you add. It takes
# the artifacts of the earlier stages, and calls no API, so it needs no secret.
evaluate:report:
  stage: report
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - task eval:merge RUN="pipeline-$CI_PIPELINE_ID"
  artifacts:
    when: always
    paths: [.eval/]
    expire_in: 3 months
