# The tasks of this repository. Each CI job calls one of them (.gitlab-ci.yml),
# so a person runs the same step on a machine with task <name>. task ci runs
# every stage in order. docs/reference/tasks-and-ci.md describes each task.
version: '3'

vars:
  # uvx runs each tool at its pinned version from the cache of uv, with no
  # .venv in the folder. So each worktree uses the same cache. uvx does not
  # read .python-version, so the Python version is here.
  UVX: uvx --python 3.12
  RUFF: '{{.UVX}} ruff@0.16.10'
  MDFORMAT: '{{.UVX}} --with mdformat-gfm==1.0.0 mdformat@1.0.0'
  PYMARKDOWN: '{{.UVX}} --from pymarkdownlnt==0.9.40 pymarkdown'
  RULES: sources/model-operating-rules.md
  # The Markdown files that format may change and lint reads, each folder
  # recursively. The rules file is not one: it is the system prompt, and only
  # a new version changes its text. lint reads it too. The run folders of
  # tests/evaluation/results/ are not either: they hold model output unchanged.
  MARKDOWN: README.md docs tests/evaluation/*.md tests/evaluation/results/README.md
  RUN_FOLDERS: tests/evaluation/results
  # The files and folders of a release. They keep their paths in .build/ and
  # in the zip, so bin/deterministic-tests.py finds sources/banned-words.txt.
  RELEASE_FILES: README.md version.json sources bin/deterministic-tests.py tests/evaluation/evaluation-tests.md
  VERSION:
    sh: |
      python3 -c 'import json; print("{major}.{minor}.{patch}".format(**json.load(open("version.json"))))'
  # The version line of the rules file leaves out a patch part of 0: 2.1.0 is "Version 2.1".
  RULES_VERSION:
    sh: |
      python3 -c 'import json; v = json.load(open("version.json")); print("{major}.{minor}".format(**v) + (".{patch}".format(**v) if v["patch"] else ""))'
  NAME: agent-operating-rules-{{.VERSION}}

tasks:
  format:
    desc: Format the Python scripts with ruff and the Markdown files with mdformat. CHECK=true changes no file, and fails when a file needs a change
    vars:
      FLAG: '{{if eq (.CHECK | default "false") "true"}}--check{{end}}'
    cmds:
      - '{{.RUFF}} format {{.FLAG}} --extend-exclude {{.RUN_FOLDERS}} .'
      - '{{.MDFORMAT}} --number {{.FLAG}} {{.MARKDOWN}}'

  lint:
    desc: Lint the Python scripts with ruff, and the Markdown files with pymarkdown and the settings of .pymarkdown.json
    cmds:
      - '{{.RUFF}} check --extend-exclude {{.RUN_FOLDERS}} .'
      - '{{.PYMARKDOWN}} --config .pymarkdown.json scan -r {{.MARKDOWN}} {{.RULES}}'

  review:
    desc: The review stage. Check the format, then lint. Format MUST run before lint, so cmds runs them in this order
    cmds:
      - task: format
        vars: {CHECK: 'true'}
      - task: lint

  build:
    desc: The build stage. Check that the version line of the rules file matches version.json, then copy the release files to .build/agent-operating-rules-<version>, each at its own path
    preconditions:
      - sh: grep -qF 'Version {{.RULES_VERSION}}, ' {{.RULES}}
        msg: "{{.RULES}} does not say Version {{.RULES_VERSION}}. Change its version line or version.json"
    # Task keeps a checksum of the sources in .task/. When they and the folder
    # are the same as at the last build, Task skips build. So package, and the
    # package job of CI with .build/ and .task/ from the build job, do not copy
    # the files again.
    sources:
      - Taskfile.yml
      - README.md
      - version.json
      - sources/**/*
      - bin/deterministic-tests.py
      - tests/evaluation/evaluation-tests.md
    generates:
      - .build/{{.NAME}}/**/*
    cmds:
      - rm -rf '.build/{{.NAME}}'
      - mkdir -p '.build/{{.NAME}}'
      - tar -cf - {{.RELEASE_FILES}} | tar -xf - -C '.build/{{.NAME}}'

  test:
    desc: The test stage. Run the unit tests of bin/ in tests/unit/, and check the pairs of tests/evaluation/pairs.json with no API call. Then run bin/deterministic-tests.py --check on the rules file at the instruction limit, and on README.md and the evaluation tests at the description limit. It fails on a finding
    cmds:
      - python3 -m unittest discover -s tests/unit
      - python3 bin/run-evaluation.py --plan > /dev/null
      - python3 bin/deterministic-tests.py --check --instructions {{.RULES}}
      - for: [README.md, tests/evaluation/evaluation-tests.md]
        cmd: python3 bin/deterministic-tests.py --check {{.ITEM}}

  docs:
    desc: The docs stage. Run bin/deterministic-tests.py --check on each page of docs/ at the description limit, then bin/check-links.py on docs/ and README.md
    vars:
      PAGES:
        sh: find docs -name '*.md' | sort
    cmds:
      - for: {var: PAGES}
        cmd: python3 bin/deterministic-tests.py --check {{.ITEM}}
      - python3 bin/check-links.py docs README.md

  package:
    desc: The package stage. Run build, then zip .build/agent-operating-rules-<version> into dist/agent-operating-rules-<version>.zip
    cmds:
      - task: build
      - task: zip

  zip:
    desc: Zip .build/agent-operating-rules-<version> into dist/, with paths that start at that folder
    internal: true
    dir: .build
    cmds:
      - mkdir -p ../dist
      - python3 -m zipfile -c '../dist/{{.NAME}}.zip' '{{.NAME}}'

  # The evaluation tasks call the Perplexity Agent API, which costs money, so
  # task ci leaves them out. task eval runs one process per provider at the
  # same time, as deps. Each writes tests/evaluation/results/RUN/results/PROVIDER.jsonl, and then
  # eval:merge writes the final view of the run from all of them. CI runs
  # eval:provider in one job per provider, and eval:merge in one job after.
  eval:
    desc: Run the evaluation prompts through the Perplexity Agent API, each provider in parallel, then merge the results. An executor answers each prompt, and two judges score each answer. PROVIDER picks one provider of tests/evaluation/pairs.json, SAMPLES sets the runs of each prompt (default 3), PROMPTS picks prompts such as C1,K1, ALL_PAIRS=true adds the pairs that are not main, and RUN names the run folder. It reads PERPLEXITY_TOKEN
    vars:
      NOW:
        sh: date -u +%Y-%m-%dT%H%M%SZ
      RUN: '{{.RUN | default .NOW}}'
      PROVIDERS:
        sh: |
          {{if .PROVIDER}}echo {{.PROVIDER}}{{else}}python3 -c 'import json; print(" ".join(json.load(open("tests/evaluation/pairs.json"))["providers"]))'{{end}}
    requires:
      vars: [PERPLEXITY_TOKEN]
    deps:
      - for: {var: PROVIDERS}
        task: eval:provider
        vars:
          PROVIDER: '{{.ITEM}}'
          RUN: '{{.RUN}}'
          PROMPTS: '{{.PROMPTS}}'
          SAMPLES: '{{.SAMPLES}}'
          ALL_PAIRS: '{{.ALL_PAIRS}}'
    cmds:
      - task: eval:merge
        vars: {RUN: '{{.RUN}}'}

  eval:provider:
    desc: Run the evaluation of one PROVIDER into tests/evaluation/results/RUN/results/PROVIDER.jsonl. task eval and the evaluate job of CI call it
    vars: &eval-args
      ARGS: >-
        {{if .PROVIDER}}--provider {{.PROVIDER}}{{end}}
        {{if .RUN}}--run-id {{.RUN}}{{end}}
        {{if .PROMPTS}}--prompts {{.PROMPTS}}{{end}}
        {{if eq (.ALL_PAIRS | default "false") "true"}}--all-pairs{{end}}
        --samples {{.SAMPLES | default 3}}
    requires:
      vars: [PERPLEXITY_TOKEN, PROVIDER, RUN]
    cmds:
      - python3 bin/run-evaluation.py {{.ARGS}}

  eval:merge:
    desc: Merge the JSONL file of each provider of tests/evaluation/results/RUN into scores.csv, calls.csv, human-test.csv and summary.md. It calls no API and needs no key
    requires:
      vars: [RUN]
    cmds:
      - python3 bin/run-evaluation.py --merge tests/evaluation/results/{{.RUN}}

  eval:plan:
    desc: Check tests/evaluation/pairs.json, and print the calls and the cost estimate of task eval with the same arguments. It calls no API and needs no key
    vars: *eval-args
    cmds:
      - python3 bin/run-evaluation.py --plan {{.ARGS}}

  eval:probe:
    desc: Send prompt C1 one time through each main pair, or the main pair of PROVIDER, each provider in parallel. Run it before the first full run, to see that each model answers and each judge returns its JSON
    cmds:
      - task: eval
        vars: {PROVIDER: '{{.PROVIDER}}', PROMPTS: C1, SAMPLES: '1'}

  ci:
    desc: "Run every stage in the order of CI: review, build, test, docs, package"
    cmds:
      - task: review
      - task: build
      - task: test
      - task: docs
      - task: package
